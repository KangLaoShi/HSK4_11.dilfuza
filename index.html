        const texts = [
            {
                title: "1. 马克介绍自己学习汉语的方法",
                lines: [
                    { speaker: "大卫", zh: "你来中国才一年，汉语就说得这么流利，真厉害！", py: "Nǐ lái Zhōngguó cái yī nián, Hànyǔ jiù shuō de zhème liúlì, zhēn lìhai!", uz: "Siz Xitoyga kelganingizga endi bir yil bo'ldi, xitoy tilida shunday ravon gapiryapsiz, juda zo'r!", ru: "Ты приехал в Китай всего год назад, а уже так свободно говоришь по-китайски, круто!", en: "You've only been in China for a year and you speak Chinese so fluently, that's awesome!" },
                    { speaker: "马克", zh: "谢谢！其实我的语法不太好，很多句子说得都不太准确。", py: "Xièxie! Qíshí wǒ de yǔfǎ bù tài hǎo, hěnduō jùzi shuō de dōu bù tài zhǔnquè.", uz: "Rahmat! Aslida grammatikam unchalik yaxshi emas, ko'p gaplarni unchalik to'g'ri aytmayman.", ru: "Спасибо! На самом деле моя грамматика не очень хороша, многие предложения я говорю не очень точно.", en: "Thanks! Actually my grammar isn't very good, I don't say a lot of sentences very accurately." },
                    { speaker: "大卫", zh: "但是我看你跟中国人交流没什么问题，你是怎么做到的？", py: "Dànshì wǒ kàn nǐ gēn Zhōngguó rén jiāoliú méi shénme wèntí, nǐ shì zěnme zuò dào de?", uz: "Lekin xitoyliklar bilan muloqot qilishda hech qanday muammo ko'rmayapman, buni qanday uddaladingiz?", ru: "Но я вижу, что у тебя нет проблем с общением с китайцами, как тебе это удалось?", en: "But I see you have no problem communicating with Chinese people, how did you do it?" },
                    { speaker: "马克", zh: "平时多交一些中国朋友，经常和他们聊天儿，听说能力自然就能得到很大的提高。另外，我建议你坚持看中文报纸，这样能学到很多新词语。", py: "Píngshí duō jiāo yīxiē Zhōngguó péngyǒu, jīngcháng hé tāmen liáotiānr, tīngshuō nénglì zìrán jiù néng dédào hěn dà de tígāo. Lìngwài, wǒ jiànyì nǐ jiānchí kàn Zhōngwén bàozhǐ, zhèyàng néng xuédào hěnduō xīn cíyǔ.", uz: "Odatda xitoylik do'stlar orttiring, ular bilan tez-tez suhbatlashing, tinglash va gapirish qobiliyati tabiiy ravishda sezilarli darajada yaxshilanadi. Bundan tashqari, xitoycha gazetalarni o'qishda davom etishni maslahat beraman, shunday qilib ko'p yangi so'zlarni o'rganish mumkin.", ru: "Обычно заводите больше китайских друзей, часто общайтесь с ними, навыки аудирования и говорения естественным образом значительно улучшатся. Кроме того, я советую тебе продолжать читать китайские газеты, так ты сможешь выучить много новых слов.", en: "Usually make more Chinese friends, often chat with them, listening and speaking skills will naturally be greatly improved. In addition, I suggest you persist in reading Chinese newspapers, this way you can learn a lot of new words." },
                    { speaker: "大卫", zh: "你太厉害了！连中文报纸都看得懂。", py: "Nǐ tài lìhai le! Lián Zhōngwén bàozhǐ dōu kàn de dǒng.", uz: "Siz juda zo'rsiz! Hatto xitoycha gazetalarni ham o'qib tushunasiz.", ru: "Ты слишком крут! Даже китайские газеты можешь читать и понимать.", en: "You are too awesome! You can even read and understand Chinese newspapers." },
                    { speaker: "马克", zh: "刚开始肯定有困难，不过遇到不认识的词语，你可以查词典，然后写在本子上，有空儿就拿出来复习一下，慢慢地就会发现中文报纸也没那么难了。", py: "Gāng kāishǐ kěndìng yǒu kùnnán, bùguò yùdào bù rènshi de cíyǔ, nǐ kěyǐ chá cídiǎn, ránhòu xiě zài běnzi shàng, yǒu kòngr jiù ná chūlái fùxí yīxià, mànmàn de jiù huì fāxiàn Zhōngwén bàozhǐ yě méi nàme nán le.", uz: "Boshida albatta qiyinchiliklar bo'ladi, lekin notanish so'zlarga duch kelganda, lug'atdan qidirib, keyin daftarga yozib qo'yishingiz mumkin, bo'sh vaqt bo'lganda olib takrorlab tursangiz, sekin-asta xitoycha gazetalar unchalik ham qiyin emasligini tushunasiz.", ru: "Вначале определенно будут трудности, но если ты встретишь незнакомые слова, ты можешь посмотреть в словаре, затем записать в тетрадь, и когда будет свободное время, доставать и повторять, и постепенно ты обнаружишь, что китайские газеты не так уж сложны.", en: "At first there will definitely be difficulties, but if you encounter unfamiliar words, you can check the dictionary, then write them in a notebook, and when you have free time, take them out to review, and slowly you will find that Chinese newspapers are not that difficult." }
                ]
            },
            {
                title: "2. 小夏和小雨聊考试的情况",
                lines: [
                    { speaker: "小夏", zh: "考试结束了，你对自己的成绩满意吗？", py: "Kǎoshì jiéshù le, nǐ duì zìjǐ de chéngjì mǎnyì ma?", uz: "Imtihon tugadi, o'z natijangizdan qoniqdingizmi?", ru: "Экзамен закончился, ты доволен своим результатом?", en: "The exam is over, are you satisfied with your result?" },
                    { speaker: "小雨", zh: "说真的，我不太满意。这次阅读考试的题太多了，我没做完。", py: "Shuō zhēnde, wǒ bù tài mǎnyì. Zhè cì yuèdú kǎoshì de tí tài duō le, wǒ méi zuò wán.", uz: "To'g'risini aytsam, unchalik qoniqmadim. Bu safargi o'qish imtihonida savollar juda ko'p edi, men tugata olmadim.", ru: "Честно говоря, я не очень доволен. На этот раз вопросов на экзамене по чтению было слишком много, я не успел закончить.", en: "To be honest, I'm not very satisfied. There were too many questions in this reading exam, I didn't finish." },
                    { speaker: "小夏", zh: "两个小时的时间应该来得及吧？", py: "Liǎng gè xiǎoshí de shíjiān yīnggāi láidejí ba?", uz: "Ikki soat vaqt ulgurishga yetishi kerak edi-ku?", ru: "Два часа времени должно было хватить, верно?", en: "Two hours should have been enough time, right?" },
                    { speaker: "小雨", zh: "这次主要是因为我先做了比较难、比较复杂的题，结果花了太多时间，后面简单的题我虽然会，可是时间来不及，最后只好放弃了。", py: "Zhè cì zhǔyào shì yīnwèi wǒ xiān zuòle bǐjiào nán, bǐjiào fùzá de tí, jiéguǒ huāle tài duō shíjiān, hòumiàn jiǎndān de tí wǒ suīrán huì, kěshì shíjiān láibují, zuìhòu zhǐhǎo fàngqì le.", uz: "Bu safar asosan men oldinroq qiyinroq va murakkabroq savollarni bajarganim sababli, natijada juda ko'p vaqt sarfladim, keyingi oddiy savollarni bilsam ham, lekin vaqt yetishmadi, oxiri ulardan voz kechishga majbur bo'ldim.", ru: "В этот раз в основном из-за того, что я сначала делал более сложные и трудные вопросы, в результате потратил слишком много времени, а хотя я знал простые вопросы в конце, времени не хватило, и в итоге пришлось от них отказаться.", en: "This time it was mainly because I did the harder, more complex questions first, resulting in spending too much time. Although I knew the simple questions later, there was no time left, and finally I had to give them up." },
                    { speaker: "小夏", zh: "其实我考得也不怎么样。有几个填空题不会做，有几个选择题，实在想不出来该选哪个，就随便猜了一个答案，结果一个都没猜对。", py: "Qíshí wǒ kǎo de yě bù zěnmeyàng. Yǒu jǐ gè tiánkòng tí bù huì zuò, yǒu jǐ gè xuǎnzé tí, shízài xiǎng bù chūlái gāi xuǎn nǎ gè, jiù suíbiàn cāi le yī gè dá'àn, jiéguǒ yī gè dōu méi cāiduì.", uz: "Aslida men ham yaxshi topshirmadim. Bir nechta bo'sh joylarni to'ldirish savollarini bajara olmadim, bir nechta tanlov savollarida qaysi birini tanlashni o'ylay olmadim, shunchaki tasodifiy javobni taxmin qildim, natijada bittasini ham to'g'ri topmadim.", ru: "На самом деле я тоже сдал не очень хорошо. Я не смог сделать несколько заданий на заполнение пропусков, и было несколько заданий с выбором ответа, я никак не мог придумать, что выбрать, просто наугад выбрал ответ, и в итоге ни одного не угадал.", en: "Actually I didn't do very well either. I couldn't do a few fill-in-the-blank questions, and for a few multiple-choice questions, I really couldn't figure out which one to choose, so I just guessed an answer randomly, and ended up not guessing any correctly." },
                    { speaker: "小雨", zh: "看来要想考好，不但要认真复习，还得注意考试的方法，否则，会做的题也没时间做了。", py: "Kànlái yào xiǎng kǎo hǎo, bùdàn yào rènzhēn fùxí, hái děi zhùyì kǎoshì de fāngfǎ, fǒuzé, huì zuò de tí yě méi shíjiān zuò le.", uz: "Ko'rinishidan yaxshi imtihon topshirish uchun nafaqat jiddiy takrorlash, balki imtihon usuliga ham e'tibor berish kerak, aks holda, bajarishni biladigan savollarga ham vaqt qolmaydi.", ru: "Кажется, чтобы хорошо сдать экзамен, нужно не только серьезно повторять, но и обращать внимание на методы сдачи экзамена, иначе не останется времени даже на те вопросы, которые ты умеешь делать.", en: "It seems that to do well in the exam, one must not only review seriously, but also pay attention to the method of taking the exam, otherwise, there won't be time to do the questions you know how to do." }
                ]
            },
            {
                title: "3. 小李告诉小林阅读的好处",
                lines: [
                    { speaker: "小林", zh: "你的客厅里怎么到处是书啊？这些书你都喜欢看吗？", py: "Nǐ de kètīng lǐ zěnme dàochù shì shū a? Zhèxiē shū nǐ dōu xǐhuān kàn ma?", uz: "Mehmonxonangizda nega hamma joyda kitoblar bor? Bu kitoblarning hammasini o'qishni yoqtirasizmi?", ru: "Почему в твоей гостиной везде книги? Тебе нравится читать все эти книги?", en: "Why are there books everywhere in your living room? Do you like reading all these books?" },
                    { speaker: "小李", zh: "当然，我每天都要看书。无论是普通杂志，还是著名小说，只要打开它们，就会发现，世界上有那么多有意思的事情，有那么多不一样生活。", py: "Dāngrán, wǒ měitiān dōu yào kànshū. Wúlùn shì pǔtōng zázhì, háishì zhùmíng xiǎoshuō, zhǐyào dǎkāi tāmen, jiù huì fāxiàn, shìjiè shàng yǒu nàme duō yǒuyìsi de shìqing, yǒu nàme duō bù yīyàng de shēnghuó.", uz: "Albatta, men har kuni kitob o'qiyman. Oddiy jurnal bo'ladimi yoki mashhur roman bo'ladimi, ularni ochishingiz bilanoq, dunyoda shunchalik ko'p qiziqarli narsalar, shunchalik ko'p turli xil hayot borligini ko'rasiz.", ru: "Конечно, я читаю книги каждый день. Будь то обычный журнал или известный роман, стоит только открыть их, и ты обнаружишь, что в мире так много интересного, так много разных жизней.", en: "Of course, I read books every day. Whether it's an ordinary magazine or a famous novel, as long as you open them, you will find that there are so many interesting things in the world, so many different lives." },
                    { speaker: "小林", zh: "想不到你工作那么忙，还能每天坚持阅读。", py: "Xiǎng bù dào nǐ gōngzuò nàme máng, hái néng měitiān jiānchí yuèdú.", uz: "Ishingiz shunchalik band bo'lishiga qaramay, har kuni o'qishni davom ettira olishingizni o'ylamagandim.", ru: "Не думал, что при такой занятости на работе ты можешь каждый день читать.", en: "I didn't expect that you could persist in reading every day when you are so busy at work." },
                    { speaker: "小李", zh: "如果3分钟读一页书，半个小时就可以读10页。每天花半个小时来读书，一个月就可以读300页，差不多就是一本书了。", py: "Rúguǒ 3 fēnzhōng dú yī yè shū, bàn gè xiǎoshí jiù kěyǐ dú 10 yè. Měitiān huā bàn gè xiǎoshí lái dúshū, yī gè yuè jiù kěyǐ dú 300 yè, chàbuduō jiù shì yī běn shū le.", uz: "Agar bir sahifa kitobni 3 daqiqada o'qisangiz, yarim soatda 10 sahifa o'qishingiz mumkin. Har kuni kitob o'qishga yarim soat sarflasangiz, bir oyda 300 sahifa o'qishingiz mumkin, bu deyarli bitta kitob degani.", ru: "Если читать страницу за 3 минуты, то за полчаса можно прочитать 10 страниц. Если каждый день тратить полчаса на чтение, то за месяц можно прочитать 300 страниц, это почти целая книга.", en: "If you read one page in 3 minutes, you can read 10 pages in half an hour. Spend half an hour reading every day, and you can read 300 pages a month, which is almost a book." },
                    { speaker: "小林", zh: "是啊，一个真正爱看书的人总能找出时间来阅读。", py: "Shì a, yī gè zhēnzhèng ài kànshū de rén zǒng néng zhǎo chū shíjiān lái yuèdú.", uz: "Shunday, haqiqatan ham kitob o'qishni yaxshi ko'radigan odam doim o'qish uchun vaqt topa oladi.", ru: "Да, человек, который по-настоящему любит читать, всегда найдет время для чтения.", en: "Yes, a person who truly loves reading can always find time to read." },
                    { speaker: "小李", zh: "坚持阅读，除了能增加知识外，还能帮助我减轻压力，人也会变得轻松起来。", py: "Jiānchí yuèdú, chúle néng zēngjiā zhīshi wài, hái néng bāngzhù wǒ jiǎnqīng yālì, rén yě huì biàn de qīngsōng qǐlái.", uz: "O'qishni davom ettirish, bilimni oshirishdan tashqari, stressni kamaytirishga ham yordam beradi va inson o'zini yengil his qila boshlaydi.", ru: "Регулярное чтение, помимо того, что расширяет знания, также помогает мне снять стресс, и человек тоже становится более расслабленным.", en: "Persisting in reading, in addition to increasing knowledge, can also help me reduce stress, and people will also become relaxed." }
                ]
            },
             {

в; во-вторых, время каждого человека ограничено, невозможно прочитать каждую книгу в мире, поэтому нужно читать хорошие книги; наконец, «любить читать» — это выработать привычку к чтению, сделать чтение своим настоящим хобби. Чтение имеет много преимуществ, оно может обогатить ваши знания, позволить вам найти решения проблем; в то же время оно также обогатит ваши эмоции, сделает вашу жизнь более яркой. Так что пусть чтение станет вашей привычкой!", en: "\"Reading is good, read good books, love to read\". Although this sentence only uses three identical Chinese characters, different orders express different meanings. First of all, \"reading is good\" means reading has many benefits; secondly, everyone's time is limited, it is impossible to read every book in the world, so we should read good books; finally, \"love to read\" is to develop the habit of reading, making reading truly become one's own interest and hobby. Reading has many benefits, it can enrich your knowledge and let you find ways to solve problems; at the same time, it will also enrich your emotions and make your life more wonderful. So, let reading become your habit!" }

                    <Flashcard word={vocabulary[currentIndex]} key={currentIndex} />
                    
                    <div className="flex gap-4 mt-8">
                        <button onClick={prevCard} className="px-6 py-3 rounded-xl glass-panel hover:bg-white/20 transition-all font-medium text-lg">
                            &larr; Oldingi
                        </button>
                        <button onClick={nextCard} className="px-6 py-3 rounded-xl glass-panel hover:bg-white/20 transition-all font-medium text-lg">
                            Keyingi &rarr;
                        </button>
                    </div>
                </div>
            );
        };

        const VocabQuizTab = () => {
            const [currentQ, setCurrentQ] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [showResult, setShowResult] = React.useState(false);
            const [options, setOptions] = React.useState([]);

            const generateOptions = (correctWord) => {
                const incorrectOptions = vocabulary
                    .filter(w => w.id !== correctWord.id)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(w => w.uz);
                
                const allOptions = [...incorrectOptions, correctWord.uz].sort(() => 0.5 - Math.random());
                setOptions(allOptions);
            };

            React.useEffect(() => {
                if (currentQ < vocabulary.length) {
                    generateOptions(vocabulary[currentQ]);
                }
            }, [currentQ]);

            const handleAnswer = (selected) => {
                if (selected === vocabulary[currentQ].uz) {
                    setScore(score + 1);
                }
                
                const nextQ = currentQ + 1;
                if (nextQ < vocabulary.length) {
                    setCurrentQ(nextQ);
                } else {
                    setShowResult(true);
                }
            };

            const resetQuiz = () => {
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
            };

            if (showResult) {
                return (
                    <div className="glass-panel p-8 rounded-2xl text-center max-w-md mx-auto mt-10">
                        <h2 className="text-3xl font-bold mb-4">Natija</h2>
                        <p className="text-2xl mb-6">{score} / {vocabulary.length}</p>
                        <button onClick={resetQuiz} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold transition-all shadow-lg">
                            Qaytadan boshlash
                        </button>
                    </div>
                );
            }

            const currentWord = vocabulary[currentQ];

            return (
                <div className="max-w-2xl mx-auto py-8">
                    <div className="mb-4 flex justify-between text-slate-300 font-medium">
                        <span>Savol: {currentQ + 1} / {vocabulary.length}</span>
                        <span>To'g'ri: {score}</span>
                    </div>
                    
                    <div className="glass-panel p-8 rounded-3xl mb-8 flex flex-col items-center shadow-lg border-indigo-500/30 border-t-4">
                        <p className="text-slate-400 mb-6 text-sm uppercase tracking-wider font-semibold">Ushbu so'zning ma'nosini toping</p>
                        <h2 className="text-6xl font-bold zh-text mb-4 tracking-widest">{currentWord?.zh}</h2>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        {options.map((opt, idx) => (
                            <button 
                                key={idx}
                                onClick={() => handleAnswer(opt)}
                                className="glass-panel p-4 rounded-xl text-lg hover:bg-indigo-600/40 transition-all text-center border border-white/10 hover:border-indigo-400 active:scale-95"
                            >
                                {opt}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const DialoguesTab = () => {
            return (
                <div className="max-w-4xl mx-auto py-6 space-y-12">
                    {texts.map((textObj, tIdx) => (
                        <div key={tIdx} className="glass-panel rounded-2xl overflow-hidden shadow-xl">
                            <div className="bg-white/10 px-6 py-4 border-b border-white/10 flex justify-between items-center">
                                <h3 className="text-xl font-bold zh-text text-indigo-300">{textObj.title}</h3>
                            </div>
                            <div className="p-6 space-y-6">
                                {textObj.lines.map((line, lIdx) => (
                                    <div key={lIdx} className="flex flex-col sm:flex-row gap-4 p-4 rounded-xl hover:bg-white/5 transition-colors group">
                                        <div className="font-bold text-purple-400 min-w-[80px] pt-1">
                                            {line.speaker}:
                                        </div>
                                        <div className="flex-1 space-y-2">
                                            <div className="flex items-start justify-between gap-4">
                                                <div>
                                                    <p className="text-2xl zh-text font-medium text-white mb-1">{line.zh}</p>
                                                    <p className="text-indigo-200 font-medium">{line.py}</p>
                                                </div>
                                                <button 
                                                    onClick={() => playAudio(line.zh)}
                                                    className="p-2 rounded-full bg-white/5 hover:bg-purple-600/50 text-slate-400 hover:text-white transition-all opacity-0 group-hover:opacity-100 flex-shrink-0"
                                                    title="Tinglash"
                                                >
                                                    <VolumeIcon />
                                                </button>
                                            </div>
                                            <div className="text-sm space-y-1 mt-3 pl-4 border-l-2 border-white/10">
                                                <p><span className="text-slate-500 w-8 inline-block">UZ:</span> <span className="text-slate-300">{line.uz}</span></p>
                                                <p><span className="text-slate-500 w-8 inline-block">RU:</span> <span className="text-slate-400">{line.ru}</span></p>
                                                <p><span className="text-slate-500 w-8 inline-block">EN:</span> <span className="text-slate-400 italic">{line.en}</span></p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const GrammarTab = () => {
            return (
                <div className="max-w-4xl mx-auto py-6 space-y-8">
                    {grammarPoints.map((gp, idx) => (
                        <div key={idx} className="glass-panel rounded-2xl p-8 shadow-lg border-l-4 border-l-purple-500 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-8 opacity-5 pointer-events-none">
                                <span className="text-9xl zh-text font-bold">{gp.title.split(' ')[1]}</span>
                            </div>
                            <h3 className="text-2xl font-bold zh-text text-purple-300 mb-4">{gp.title}</h3>
                            <div className="mb-6 space-y-2 text-slate-300 whitespace-pre-line leading-relaxed">
                                {gp.explanation}
                            </div>
                            <div className="space-y-4 bg-black/20 p-5 rounded-xl">
                                <h4 className="font-semibold text-slate-400 mb-3 uppercase tracking-wider text-sm">Misollar (Examples):</h4>
                                {gp.examples.map((ex, eIdx) => (
                                    <div key={eIdx} className="space-y-1">
                                        <p className="text-lg zh-text text-white">{ex.zh}</p>
                                        <p className="text-indigo-300 text-sm">{ex.py}</p>
                                        <p className="text-slate-400 text-sm italic">{ex.uz}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const GrammarQuizTab = () => {
            const [currentQ, setCurrentQ] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [showResult, setShowResult] = React.useState(false);
            
            // Randomize order on mount
            const [shuffledQuiz, setShuffledQuiz] = React.useState([]);
            
            React.useEffect(() => {
                setShuffledQuiz([...grammarQuiz].sort(() => 0.5 - Math.random()));
            }, []);

            if (shuffledQuiz.length === 0) return null;

            const handleAnswer = (selected) => {
                if (selected === shuffledQuiz[currentQ].answer) {
                    setScore(score + 1);
                }
                
                const nextQ = currentQ + 1;
                if (nextQ < shuffledQuiz.length) {
                    setCurrentQ(nextQ);
                } else {
                    setShowResult(true);
                }
            };

            const resetQuiz = () => {
                setShuffledQuiz([...grammarQuiz].sort(() => 0.5 - Math.random()));
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
            };

            if (showResult) {
                return (
                    <div className="glass-panel p-8 rounded-2xl text-center max-w-md mx-auto mt-10">
                        <h2 className="text-3xl font-bold mb-4">Natija</h2>
                        <p className="text-2xl mb-6">{score} / {shuffledQuiz.length}</p>
                        <button onClick={resetQuiz} className="px-8 py-3 bg-purple-600 hover:bg-purple-700 rounded-xl font-bold transition-all shadow-lg">
                            Qaytadan boshlash
                        </button>
                    </div>
                );
            }

            const currentQuestion = shuffledQuiz[currentQ];

            return (
                <div className="max-w-2xl mx-auto py-8">
                    <div className="mb-4 flex justify-between text-slate-300 font-medium">
                        <span>Savol: {currentQ + 1} / {shuffledQuiz.length}</span>
                        <span>To'g'ri: {score}</span>
                    </div>
                    
                    <div className="glass-panel p-10 rounded-3xl mb-8 shadow-lg text-center min-h-[200px] flex items-center justify-center">
                        <h2 className="text-3xl font-medium zh-text leading-relaxed">
                            {currentQuestion.q.split('___').map((part, i, arr) => (
                                <React.Fragment key={i}>
                                    {part}
                                    {i < arr.length - 1 && (
                                        <span className="inline-block w-16 border-b-2 border-purple-400 mx-2"></span>
                                    )}
                                </React.Fragment>
                            ))}
                        </h2>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        {currentQuestion.options.map((opt, idx) => (
                            <button 
                                key={idx}
                                onClick={() => handleAnswer(opt)}
                                className="glass-panel py-5 rounded-xl text-2xl zh-text hover:bg-purple-600/40 transition-all border border-white/10 hover:border-purple-400 active:scale-95 font-medium"
                            >
                                {opt}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const FillBlanksTab = () => {
            const [answers, setAnswers] = React.useState(Array(fillBlanksData.length).fill(""));
            const [submitted, setSubmitted] = React.useState(false);

            // Extract all unique words for the word bank
            const wordBank = [...new Set(fillBlanksData.map(item => item.word))].sort(() => 0.5 - Math.random());

            const handleSelectChange = (index, value) => {
                if(submitted) return;
                const newAnswers = [...answers];
                newAnswers[index] = value;
                setAnswers(newAnswers);
            };

            const calculateScore = () => {
                return answers.filter((ans, i) => ans === fillBlanksData[i].word).length;
            };

            return (
                <div className="max-w-4xl mx-auto py-6">
                    <div className="glass-panel p-6 rounded-2xl mb-8">
                        <h3 className="text-lg font-semibold mb-4 text-indigo-300">So'zlar banki (Word Bank):</h3>
                        <div className="flex flex-wrap gap-3">
                            {wordBank.map((word, idx) => (
                                <span key={idx} className="px-4 py-2 bg-white/10 rounded-lg zh-text font-medium border border-white/5">
                                    {word}
                                </span>
                            ))}
                        </div>
                    </div>

                    <div className="space-y-4">
                        {fillBlanksData.map((item, idx) => (
                            <div key={idx} className="glass-panel p-5 rounded-xl flex items-center gap-4 flex-wrap">
                                <span className="font-mono text-slate-500">{idx + 1}.</span>
                                <div className="text-xl zh-text flex-1 flex flex-wrap items-center gap-2">
                                    {item.sentence.split('[blank]').map((part, i, arr) => (
                                        <React.Fragment key={i}>
                                            <span>{part}</span>
                                            {i < arr.length - 1 && (
                                                <select 
                                                    className={`bg-black/30 border border-white/20 rounded-md py-1 px-3 outline-none focus:border-indigo-400 zh-text min-w-[100px] text-center
                                                        ${submitted ? (answers[idx] === item.word ? 'border-green-500 text-green-400' : 'border-red-500 text-red-400') : ''}
                                                    `}
                                                    value={answers[idx]}
                                                    onChange={(e) => handleSelectChange(idx, e.target.value)}
                                                    disabled={submitted}
                                                >
                                                    <option value=""></option>
                                                    {wordBank.map(w => (
                                                        <option key={w} value={w} className="bg-slate-800">{w}</option>
                                                    ))}
                                                </select>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </div>
                                {submitted && answers[idx] !== item.word && (
                                    <span className="text-green-400 text-sm zh-text ml-auto bg-green-400/10 px-3 py-1 rounded">To'g'ri: {item.word}</span>
                                )}
                            </div>
                        ))}
                    </div>

                    <div className="mt-8 flex flex-col items-center gap-4">
                        {!submitted ? (
                            <button 
                                onClick={() => setSubmitted(true)}
                                className="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-bold transition-all shadow-lg text-lg"
                            >
                                Tekshirish
                            </button>
                        ) : (
                            <div className="text-center">
                                <p className="text-2xl font-bold mb-4">Natija: {calculateScore()} / {fillBlanksData.length}</p>
                                <button 
                                    onClick={() => { setSubmitted(false); setAnswers(Array(fillBlanksData.length).fill("")); }}
                                    className="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium transition-all"
                                >
                                    Qaytadan urinish
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('lugat');

            const tabs = [
                { id: 'lugat', label: "Lug'at" },
                { id: 'lugat_test', label: "Lug'at Testi" },
                { id: 'muloqot', label: "Muloqot" },
                { id: 'grammatika', label: "Grammatika" },
                { id: 'grammatika_test', label: "Grammatika Testi" },
                { id: 'soz_toldirish', label: "So'zlarni to'ldirish" }
            ];

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header */}
                    <header className="pt-10 pb-6 px-4 text-center">
                        <h1 className="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-300 mb-2 tracking-tight">
                            HSK 4 - Lesson 11
                        </h1>
                        <p className="text-lg md:text-xl text-indigo-200/80 font-medium">
                            Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz
                        </p>
                    </header>

                    {/* Navigation */}
                    <div className="container mx-auto px-4 mb-8">
                        <nav className="flex flex-wrap justify-center gap-2 md:gap-4 p-2 glass-panel rounded-2xl max-w-5xl mx-auto">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-2 rounded-xl text-sm md:text-base font-medium transition-all duration-300 
                                        ${activeTab === tab.id 
                                            ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg' 
                                            : 'hover:bg-white/10 text-slate-300 hover:text-white'}`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </nav>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 container mx-auto px-4 pb-12 w-full max-w-6xl">
                        {activeTab === 'lugat' && <FlashcardsTab />}
                        {activeTab === 'lugat_test' && <VocabQuizTab />}
                        {activeTab === 'muloqot' && <DialoguesTab />}
                        {activeTab === 'grammatika' && <GrammarTab />}
                        {activeTab === 'grammatika_test' && <GrammarQuizTab />}
                        {activeTab === 'soz_toldirish' && <FillBlanksTab />}
                    </main>

                    {/* Footer */}
                    <footer className="py-6 mt-auto text-center border-t border-white/10 bg-black/20 backdrop-blur-md">
                        <p className="text-slate-400 text-sm">
                            HSK 4 - Lesson 11<br/>
                            &copy; 2026 Dilfuza Kāng lǎo shī (telegram@diffila)
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
